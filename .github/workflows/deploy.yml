name: Deploy static demo preview

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: shangzheny/rth-host-helper:latest

    steps:
      # This publishes the static frontend preview only; it does not deploy the API.
      - name: Deploy frontend demo preview to Retinbox
        uses: rthsoftware/host-auto-deploy@master
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
