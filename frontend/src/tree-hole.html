<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="深小狸树洞 · 不署名的心声" />
    <meta name="theme-color" content="#1b4332" />
    <title>树洞 | 深小狸</title>
    <link rel="icon" type="image/png" href="./mascot-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header" data-active="tree-hole"></div>
    <main
      data-requires-auth
      hidden
      class="min-h-screen w-full bg-background pt-20"
    >
      <div class="flex w-full flex-col">
        <!-- Hero / Header Section -->
        <section class="w-full bg-surface-container-low px-gutter py-16">
          <div
            class="mx-auto flex max-w-[1200px] flex-col justify-between gap-8 md:flex-row md:items-end"
          >
            <div>
              <div
                class="mb-4 inline-flex items-center gap-2 rounded-full bg-secondary-container px-3 py-1 text-label-sm text-on-secondary-container"
              >
                <span class="material-symbols-outlined text-sm"
                  >nest_cam_wired_stand</span
                >
                <span>深小狸 · 匿名树洞</span>
              </div>
              <h1 class="font-headline-xl font-bold text-primary">
                深小狸树洞
              </h1>
              <p class="mt-2 text-body-lg text-on-surface-variant">
                说点平时不太方便说的话。
              </p>
            </div>
            <!-- Quick Stats / Trust Badge -->
            <div
              class="flex items-center gap-6 rounded-xl bg-surface p-4 shadow-sm"
            >
              <div class="flex flex-col">
                <span class="text-label-sm text-outline">公开树洞</span>
                <span
                  class="font-headline-md font-bold text-primary"
                  data-tree-count
                  >—</span
                >
              </div>
              <div class="h-8 w-[1px] bg-surface-variant"></div>
              <div class="flex flex-col">
                <span class="text-label-sm text-outline">公开方式</span>
                <span class="font-headline-md font-bold text-secondary"
                  >公开匿名</span
                >
              </div>
            </div>
          </div>
        </section>
        <!-- Main Content Layout: Two Columns (Publish/Sidebar + Feed) -->
        <div
          class="mx-auto grid w-full max-w-[1200px] grid-cols-1 gap-8 px-gutter py-12 lg:grid-cols-12"
        >
          <!-- Left Column: Publish Box & Categories (4 Cols) -->
          <div class="flex flex-col gap-8 lg:col-span-4">
            <!-- Publish Box Card -->
            <div
              class="flex flex-col gap-4 rounded-xl bg-surface p-6 shadow-sm"
            >
              <div class="flex items-center justify-between">
                <h3
                  class="flex items-center gap-2 font-headline-sm font-semibold text-primary"
                >
                  <span class="material-symbols-outlined text-secondary"
                    >edit_note</span
                  >
                  写树洞
                </h3>
                <!-- Anonymous Toggle -->
                <div
                  class="flex items-center gap-2 rounded-full bg-surface-container-low px-3 py-1"
                >
                  <span class="text-label-sm text-on-surface-variant"
                    >匿名</span
                  >
                  <input
                    checked=""
                    aria-label="公开时匿名显示"
                    class="h-4 w-4 accent-primary"
                    disabled
                    type="checkbox"
                  />
                </div>
              </div>
              <textarea
                aria-describedby="tree-hole-status"
                class="w-full resize-none rounded-xl bg-surface-container-low p-3 text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary"
                id="tree-hole-input"
                maxlength="1000"
                placeholder="有什么想说的？"
                rows="4"
              ></textarea>
              <!-- Tag Selector -->
              <div class="flex flex-wrap gap-2">
                <button
                  data-tree-topic="科研"
                  class="rounded-full bg-surface-container-low px-3 py-1 text-label-sm text-on-surface-variant transition-colors hover:bg-secondary-container hover:text-on-secondary-container"
                >
                  #科研
                </button>
                <button
                  data-tree-topic="选课"
                  class="rounded-full bg-surface-container-low px-3 py-1 text-label-sm text-on-surface-variant transition-colors hover:bg-secondary-container hover:text-on-secondary-container"
                >
                  #选课
                </button>
                <button
                  data-tree-topic="求助"
                  class="rounded-full bg-surface-container-low px-3 py-1 text-label-sm text-on-surface-variant transition-colors hover:bg-secondary-container hover:text-on-secondary-container"
                >
                  #求助
                </button>
                <button
                  data-tree-topic="情绪"
                  class="rounded-full bg-surface-container-low px-3 py-1 text-label-sm text-on-surface-variant transition-colors hover:bg-secondary-container hover:text-on-secondary-container"
                >
                  #情绪
                </button>
                <button
                  data-tree-topic="搭子"
                  class="rounded-full bg-surface-container-low px-3 py-1 text-label-sm text-on-surface-variant transition-colors hover:bg-secondary-container hover:text-on-secondary-container"
                >
                  #搭子
                </button>
              </div>
              <div class="flex items-center justify-between pt-2">
                <div class="flex items-center gap-2 text-label-sm text-outline">
                  <span class="material-symbols-outlined text-sm">lock</span>
                  公开内容匿名显示；账号仅用于限流与审核
                </div>
                <button
                  id="tree-hole-publish"
                  class="flex items-center gap-2 rounded-xl bg-primary px-6 py-2 text-label-md text-on-primary transition-colors hover:bg-secondary"
                  type="button"
                >
                  <span class="material-symbols-outlined text-sm">send</span>
                  扔进树洞
                </button>
              </div>
              <p
                aria-live="polite"
                class="min-h-5 text-body-sm text-outline"
                id="tree-hole-status"
              ></p>
            </div>
            <!-- Categories Filter Card -->
            <div
              class="flex flex-col gap-4 rounded-xl bg-surface p-6 shadow-sm"
              id="tree-topic-filter"
            >
              <h4
                class="flex items-center gap-2 font-headline-sm font-medium text-primary"
              >
                <span class="material-symbols-outlined text-secondary"
                  >filter_list</span
                >
                话题分类
              </h4>
              <div class="flex flex-wrap gap-2">
                <button
                  type="button"
                  class="rounded-full bg-primary px-3 py-1.5 text-label-sm text-on-primary transition-colors"
                >
                  全部
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  校园生活
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  学习
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  科研
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  选课
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  求助
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  生存
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  情绪
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  吐槽
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  搭子
                </button>
                <button
                  type="button"
                  class="rounded-full bg-surface-container-low px-3 py-1.5 text-label-sm text-on-surface-variant transition-colors hover:bg-surface-container-high"
                >
                  失物招领
                </button>
              </div>
            </div>
          </div>
          <!-- Right Column: Post Feed (8 Cols) -->
          <div class="flex flex-col gap-6 lg:col-span-8" id="tree-hole-feed">
            <p
              class="rounded-xl bg-surface p-8 text-center text-body-sm text-outline"
            >
              正在加载校园树洞…
            </p>
          </div>
        </div>
      </div>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
