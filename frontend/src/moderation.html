<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="深小狸社区内容审核工作台" />
    <meta name="theme-color" content="#1b4332" />
    <title>内容审核 | 深小狸校园</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header"></div>
    <main
      data-requires-auth
      hidden
      class="mx-auto min-h-[75vh] w-full max-w-[1200px] px-gutter pb-20 pt-28"
    >
      <header
        class="mb-8 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"
      >
        <div>
          <h1 class="font-headline-xl text-primary">内容审核</h1>
          <p class="mt-2 max-w-2xl text-body-md text-on-surface-variant">
            只处理队列中的课程评价、匿名树洞与用户举报。树洞公开内容不会包含账号标识。
          </p>
        </div>
        <button
          type="button"
          data-refresh-queue
          class="rounded-xl border border-outline-variant bg-surface px-4 py-2.5 text-label-md text-primary hover:bg-surface-container-low"
        >
          刷新队列
        </button>
      </header>
      <section
        data-moderation-status
        class="mb-6 rounded-xl border border-outline-variant bg-surface p-5 text-body-md text-on-surface-variant"
        aria-live="polite"
      >
        正在检查审核权限…
      </section>
      <section
        data-moderation-queue
        class="flex flex-col gap-4"
        aria-live="polite"
      ></section>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
