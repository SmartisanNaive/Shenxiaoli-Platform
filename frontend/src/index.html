<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="深小狸 · 评课、集市、技能互助与树洞" />
    <meta name="theme-color" content="#1b4332" />
    <title>首页 | 深小狸</title>
    <link rel="icon" type="image/png" href="./mascot-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header" data-active="home"></div>
    <main class="w-full bg-background pt-20">
      <div class="flex w-full flex-col">
        <div
          class="relative mb-16 w-full overflow-hidden bg-primary px-6 py-24 text-on-primary md:px-12"
        >
          <div
            class="absolute inset-0 bg-cover bg-center opacity-10"
            aria-hidden="true"
            style="
              background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDlgAoyN4GS1zWkQG_a8rCUIflXZ3P41GuTcQy_Sd0HLTDpF-EScrzE_knUzjNMnfVfW6sNNNbUlIm6xCgQNylE2jKeInQRnzpZH3asGfO6ip4MtrDQTVPNMe7YJzBqc8lfGnkzgudxVDYl1QqGVnnMyiBpeUsUMiJGrRDBEcXg9mPvzG5AdQSm7tgWQ3dtDsOKpT0L3-CDsszDqTNeu0WF-cqAqL6RHh1aJ_91urgSvzcDFBOo5lWJrQ');
            "
          ></div>
          <div
            class="relative z-10 mx-auto flex max-w-[1200px] flex-col items-start gap-6"
          >
            <div class="text-label-sm text-primary-fixed-dim">
              <span>学生共建的校园社区</span>
            </div>
            <h1
              class="font-headline-xl text-5xl font-bold tracking-tight text-on-primary md:text-6xl"
            >
              深小狸
            </h1>
            <p class="max-w-xl font-body-lg text-lg text-primary-fixed-dim">
              查看课程评价、发布闲置、交流技能，也可以在树洞里聊聊校园生活。
            </p>
            <div class="mt-4 flex flex-wrap items-center gap-3 sm:gap-4">
              <a
                class="rounded bg-surface px-6 py-3 font-label-md text-primary shadow-sm transition-colors hover:bg-surface-bright"
                data-path="course-evaluation"
                href="./course-evaluation.html"
              >
                探索课程评价
              </a>
              <a
                class="rounded border border-outline-variant bg-transparent px-6 py-3 font-label-md text-on-primary transition-colors hover:bg-surface/10"
                data-path="tree-hole"
                href="./tree-hole.html"
              >
                进入树洞交流
              </a>
            </div>
          </div>
        </div>
        <div class="mx-auto mb-20 w-full max-w-[1200px] px-[32px]">
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
            <a
              class="group relative flex flex-col justify-between rounded-md border border-surface-variant bg-surface-container-lowest p-6 transition-colors duration-150 hover:border-outline"
              data-path="course-evaluation"
              href="./course-evaluation.html"
            >
              <div>
                <div class="mb-4 text-primary">
                  <span
                    class="material-symbols-outlined text-2xl"
                    style="font-variation-settings: 'FILL' 1"
                    >book_2</span
                  >
                </div>
                <h3
                  class="mb-2 font-headline-sm text-xl font-bold text-primary"
                >
                  课程评价
                </h3>
                <p class="font-body-md text-on-surface-variant">
                  查看课程内容、考核方式和同学的修读建议。
                </p>
              </div>
              <div
                class="mt-6 flex items-center gap-2 font-label-md text-primary"
              >
                <span>立即查看</span>
                <span class="material-symbols-outlined text-sm"
                  >arrow_forward</span
                >
              </div>
            </a>
            <a
              class="group relative flex flex-col justify-between rounded-md border border-surface-variant bg-surface-container-lowest p-6 transition-colors duration-150 hover:border-outline"
              data-path="market"
              href="./market.html"
            >
              <div>
                <div class="mb-4 text-primary">
                  <span
                    class="material-symbols-outlined text-2xl"
                    style="font-variation-settings: 'FILL' 1"
                    >storefront</span
                  >
                </div>
                <h3
                  class="mb-2 font-headline-sm text-xl font-bold text-primary"
                >
                  校园集市
                </h3>
                <p class="font-body-md text-on-surface-variant">
                  发布闲置物品，查看价格、成色和校内面交地点。
                </p>
              </div>
              <div
                class="mt-6 flex items-center gap-2 font-label-md text-primary"
              >
                <span>去逛集市</span>
                <span class="material-symbols-outlined text-sm"
                  >arrow_forward</span
                >
              </div>
            </a>
            <a
              class="group relative flex flex-col justify-between rounded-md border border-surface-variant bg-surface-container-lowest p-6 transition-colors duration-150 hover:border-outline"
              data-path="skill-mutual-aid"
              href="./skill-mutual-aid.html"
            >
              <div>
                <div class="mb-4 text-primary">
                  <span
                    class="material-symbols-outlined text-2xl"
                    style="font-variation-settings: 'FILL' 1"
                    >handshake</span
                  >
                </div>
                <h3
                  class="mb-2 font-headline-sm text-xl font-bold text-primary"
                >
                  技能互助
                </h3>
                <p class="font-body-md text-on-surface-variant">
                  分享你会的技能，发布求助，和同学交流经验。
                </p>
              </div>
              <div
                class="mt-6 flex items-center gap-2 font-label-md text-primary"
              >
                <span>寻找搭子</span>
                <span class="material-symbols-outlined text-sm"
                  >arrow_forward</span
                >
              </div>
            </a>
            <a
              class="group relative flex flex-col justify-between rounded-md border border-surface-variant bg-surface-container-lowest p-6 transition-colors duration-150 hover:border-outline"
              data-path="tree-hole"
              href="./tree-hole.html"
            >
              <div>
                <div class="mb-4 text-primary">
                  <span
                    class="material-symbols-outlined text-2xl"
                    style="font-variation-settings: 'FILL' 1"
                    >forum</span
                  >
                </div>
                <h3
                  class="mb-2 font-headline-sm text-xl font-bold text-primary"
                >
                  深小狸树洞
                </h3>
                <p class="font-body-md text-on-surface-variant">
                  不署名地聊校园生活，也听听同学们的近况。
                </p>
              </div>
              <div
                class="mt-6 flex items-center gap-2 font-label-md text-primary"
              >
                <span>进入树洞</span>
                <span class="material-symbols-outlined text-sm"
                  >arrow_forward</span
                >
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
