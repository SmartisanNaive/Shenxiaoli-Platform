<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="深小狸评课 · 选课之前,先看看大家怎么说" />
    <meta name="theme-color" content="#1b4332" />
    <title>评课 | 深小狸</title>
    <link rel="icon" type="image/png" href="./mascot-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header" data-active="course-evaluation"></div>
    <main
      data-requires-auth
      hidden
      class="min-h-screen w-full bg-background pt-20"
    >
      <div class="flex w-full flex-col">
        <!-- Header / Intro banner without duplicating H1 -->
        <section class="w-full bg-surface-container-low px-gutter py-12">
          <div
            class="mx-auto flex max-w-[1200px] flex-col items-start justify-between gap-6 md:flex-row md:items-end"
          >
            <div>
              <div
                class="mb-4 inline-flex items-center gap-2 rounded-full bg-secondary-container px-3 py-1 text-label-sm text-on-secondary-container"
              >
                <span class="material-symbols-outlined text-sm">school</span>
                深小狸评课 · 学生共建
              </div>
              <h2 class="mb-2 font-headline-xl text-primary">深小狸评课</h2>
              <p class="text-body-lg text-on-surface-variant">
                选课之前，先看看大家怎么说。
              </p>
            </div>
            <div class="flex items-center gap-3">
              <button
                id="course-import-cta"
                type="button"
                class="rounded border border-primary px-4 py-2.5 text-label-md text-primary hover:bg-secondary-container"
              >
                导入教务课程
              </button>
              <button
                class="flex items-center gap-2 rounded bg-primary px-4 py-2.5 text-label-md text-on-primary shadow-sm transition-colors hover:bg-secondary"
                id="review-cta"
                type="button"
              >
                <span class="material-symbols-outlined text-sm"
                  >rate_review</span
                >
                写条评价
              </button>
            </div>
          </div>
        </section>
        <nav
          class="mx-auto flex w-full max-w-[1200px] gap-3 px-gutter py-6"
          aria-label="课程范围"
        >
          <button
            type="button"
            data-course-scope="all"
            aria-pressed="true"
            class="rounded border border-outline-variant px-4 py-2 text-label-md text-primary aria-pressed:bg-primary aria-pressed:text-on-primary"
          >
            全部课程
          </button>
          <button
            type="button"
            data-course-scope="mine"
            aria-pressed="false"
            class="rounded border border-outline-variant px-4 py-2 text-label-md text-primary aria-pressed:bg-primary aria-pressed:text-on-primary"
          >
            我的课程
          </button>
        </nav>
        <section
          id="my-courses"
          hidden
          class="mx-auto w-full max-w-[1200px] px-gutter pb-12"
          aria-label="我的课程"
        >
          <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
            <h2 class="font-headline-lg text-primary">我的课程</h2>
            <label class="text-body-sm text-outline"
              >学期
              <select
                id="my-courses-term"
                class="rounded border border-outline-variant bg-surface px-3 py-2"
              >
                <option value="">全部学期</option>
              </select></label
            >
          </div>
          <p class="mb-4 text-body-sm text-outline">
            选课记录仅自己可见，课程资料用于补充公共课程库。
          </p>
          <div id="my-course-list" class="space-y-3" aria-live="polite"></div>
        </section>
        <!-- Filter Bar -->
        <section
          data-course-catalog
          class="relative z-10 mx-auto -mt-6 w-full max-w-[1200px] px-gutter"
        >
          <div class="rounded bg-surface p-6 shadow-md shadow-primary/5">
            <div class="flex flex-wrap items-center gap-4">
              <!-- Search Input -->
              <div class="relative min-w-[260px] flex-1">
                <span
                  class="material-symbols-outlined absolute left-3 top-2.5 text-lg text-outline"
                  >search</span
                >
                <input
                  id="course-search"
                  class="w-full rounded bg-surface-container-low py-2 pl-10 pr-4 text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary"
                  placeholder="搜索课程代码、名称或授课教师…"
                  type="text"
                />
              </div>
              <!-- Filter Dropdowns -->
              <div class="flex flex-wrap items-center gap-3">
                <select
                  data-course-filter="courseType"
                  class="rounded bg-surface-container-low px-4 py-2 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option>课程类型: 全部</option>
                  <option>公共课</option>
                  <option>专业课</option>
                </select>
                <select
                  data-course-filter="enrollmentType"
                  class="rounded bg-surface-container-low px-4 py-2 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option>修读性质: 全部</option>
                  <option>必修</option>
                  <option>选修</option>
                </select>
                <select
                  data-course-filter="term"
                  class="rounded bg-surface-container-low px-4 py-2 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option>学期: 全部</option>
                  <option>春季</option>
                  <option>秋季</option>
                </select>
                <select
                  data-course-filter="assessment"
                  class="rounded bg-surface-container-low px-4 py-2 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option>考核方式: 全部</option>
                  <option>考试</option>
                  <option>考查</option>
                </select>
                <select
                  data-course-filter="department"
                  class="rounded bg-surface-container-low px-4 py-2 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option>全部学院</option>
                  <option>细胞与基因技术研究院</option>
                  <option>生物医学工程学院</option>
                  <option>药学院</option>
                  <option>合成生物学院</option>
                </select>
              </div>
            </div>
          </div>
        </section>
        <!-- Main Content Layout: Split View / Course List + Detail Modal Container -->
        <section
          data-course-catalog
          class="mx-auto grid w-full max-w-[1200px] grid-cols-1 gap-8 px-gutter py-12 lg:grid-cols-12"
        >
          <!-- Course Cards List (Left 7 Cols) -->
          <div class="flex flex-col gap-4 lg:col-span-5" id="course-list">
            <p
              class="rounded bg-surface p-8 text-center text-body-sm text-outline"
            >
              正在加载课程库…
            </p>
          </div>
          <!-- Course Detailed View Section for FBEE501 (Right 7 Cols) -->
          <div class="flex flex-col gap-6 lg:col-span-7" id="course-detail">
            <p
              class="rounded bg-surface p-8 text-center text-body-sm text-outline"
            >
              选择一门课程以查看真实评价。
            </p>
          </div>
        </section>
        <section
          data-course-catalog
          id="teacher-directory"
          class="mx-auto w-full max-w-[1200px] px-gutter pb-14"
        >
          <div class="rounded bg-surface p-6 shadow-sm">
            <div
              class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between"
            >
              <div>
                <h2 class="font-headline-lg text-primary">教师与授课记录</h2>
                <p class="mt-1 text-body-sm text-outline">
                  教师信息按真实开课记录维护；历史评价没有教师关联时会继续标注待补充。
                </p>
              </div>
              <label class="w-full md:max-w-sm"
                ><span class="sr-only">搜索教师</span
                ><input
                  id="teacher-search"
                  type="search"
                  placeholder="搜索教师姓名、标识或院系"
                  class="w-full rounded bg-surface-container-low px-4 py-2.5 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
              /></label>
            </div>
            <div
              class="mt-5 grid gap-5 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)]"
            >
              <div id="teacher-results" class="space-y-2">
                <p class="text-body-sm text-outline">正在读取教师名录…</p>
              </div>
              <div
                id="teacher-detail"
                class="rounded-lg bg-surface-container-low p-5 text-body-sm text-outline"
              >
                选择一位教师查看授课记录。
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
