<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="深小狸校园个人中心：管理发布、消息、通知与收藏"
    />
    <title>个人中心 | 深小狸校园</title>
    <link rel="icon" type="image/png" href="./mascot-favicon.png" />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header"></div>
    <main
      data-requires-auth
      hidden
      class="min-h-screen bg-background px-4 pb-16 pt-28 sm:px-6"
    >
      <div class="mx-auto max-w-[1100px]">
        <header class="mb-8">
          <p class="text-label-sm text-secondary">账号与社区记录</p>
          <h1 class="mt-2 font-headline-xl text-primary">个人中心</h1>
          <p class="mt-2 text-body-md text-on-surface-variant">
            在这里维护发布、继续私信交流，并查看社区通知。
          </p>
        </header>
        <nav class="mb-6 flex flex-wrap gap-2" aria-label="个人中心栏目">
          <button class="account-tab" data-tab="publications">我的发布</button>
          <button class="account-tab" data-tab="messages">私信</button>
          <button class="account-tab" data-tab="requests">联系请求</button>
          <button class="account-tab" data-tab="collaborations">
            互助进度
          </button>
          <button class="account-tab" data-tab="notifications">通知</button>
          <button class="account-tab" data-tab="appeals">申诉与复核</button>
          <button class="account-tab" data-tab="favorites">收藏</button>
          <button class="account-tab" data-tab="profile">账号设置</button>
        </nav>
        <section
          class="rounded-2xl bg-surface-container-lowest p-4 shadow-sm sm:p-7"
          data-account-panel
        >
          <div data-account-content>
            <p class="text-body-sm text-outline">正在加载…</p>
          </div>
        </section>
      </div>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
