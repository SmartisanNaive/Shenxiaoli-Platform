<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="技能互助 · 找搭子,互帮互助" />
    <meta name="theme-color" content="#1b4332" />
    <title>技能互助 | 深小狸校园</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <script type="module" src="./scripts/main.ts"></script>
  </head>
  <body class="bg-background font-body-md text-on-surface">
    <div data-layout="header" data-active="skill-mutual-aid"></div>
    <main
      data-requires-auth
      hidden
      class="min-h-screen w-full bg-background pt-20"
    >
      <div class="flex w-full flex-col">
        <!-- Hero / Header Intro Section -->
        <section
          class="mx-auto flex w-full max-w-[1200px] flex-col items-start justify-between gap-6 px-[32px] pb-8 pt-12 md:flex-row md:items-end"
        >
          <div class="flex flex-col gap-2">
            <div
              class="flex items-center gap-2 text-label-sm font-semibold uppercase tracking-wider text-secondary"
            >
              <span class="material-symbols-outlined text-sm">handshake</span>
              深小狸 · 技能互助
            </div>
            <h1 class="font-headline-xl text-headline-xl text-primary">
              技能互助
            </h1>
            <p class="max-w-xl text-body-lg text-on-surface-variant">
              你会的，可能正是别人需要的。打破信息壁垒，以技能换技能，以经验聚同道。
            </p>
          </div>
          <div class="flex items-center gap-3">
            <button
              type="button"
              id="skill-publish-open"
              class="flex items-center gap-2 rounded-xl bg-primary px-6 py-3 text-label-md font-semibold text-on-primary shadow-sm transition-all hover:bg-secondary"
              onclick="
                document
                  .getElementById('publish-modal')
                  .classList.remove('hidden')
              "
            >
              <span class="material-symbols-outlined">add_circle</span>
              发布技能或求助
            </button>
          </div>
        </section>
        <!-- Categories Bar -->
        <section class="mx-auto mb-12 w-full max-w-[1200px] px-[32px]">
          <div
            class="scrollbar-hidden flex items-center gap-3 overflow-x-auto pb-2"
          >
            <button
              type="button"
              data-skill-category="all"
              class="whitespace-nowrap rounded-xl bg-primary px-5 py-2.5 text-label-md font-medium text-on-primary shadow-sm transition-all"
            >
              全部领域
            </button>
            <button
              type="button"
              data-skill-category="数据与科研"
              class="whitespace-nowrap rounded-xl bg-surface-container px-5 py-2.5 text-label-md font-medium text-on-surface transition-all hover:bg-surface-container-high"
            >
              数据与科研
            </button>
            <button
              type="button"
              data-skill-category="生物实验"
              class="whitespace-nowrap rounded-xl bg-surface-container px-5 py-2.5 text-label-md font-medium text-on-surface transition-all hover:bg-surface-container-high"
            >
              生物实验
            </button>
            <button
              type="button"
              data-skill-category="工程开发"
              class="whitespace-nowrap rounded-xl bg-surface-container px-5 py-2.5 text-label-md font-medium text-on-surface transition-all hover:bg-surface-container-high"
            >
              工程开发
            </button>
            <button
              type="button"
              data-skill-category="AI与计算"
              class="whitespace-nowrap rounded-xl bg-surface-container px-5 py-2.5 text-label-md font-medium text-on-surface transition-all hover:bg-surface-container-high"
            >
              AI与计算
            </button>
            <button
              type="button"
              data-skill-category="设计创作"
              class="whitespace-nowrap rounded-xl bg-surface-container px-5 py-2.5 text-label-md font-medium text-on-surface transition-all hover:bg-surface-container-high"
            >
              设计创作
            </button>
          </div>
        </section>
        <!-- Notice Banner -->
        <section class="mx-auto mb-12 w-full max-w-[1200px] px-[32px]">
          <div
            class="flex items-start gap-4 rounded-2xl bg-surface-container-low p-6 shadow-sm"
          >
            <div
              class="flex-shrink-0 rounded-xl bg-primary-fixed p-2.5 text-primary"
            >
              <span
                class="material-symbols-outlined"
                style="font-variation-settings: 'FILL' 1"
                >verified_user</span
              >
            </div>
            <div class="flex flex-col gap-1">
              <h3 class="font-headline-sm text-headline-sm text-primary">
                学术诚信与互助准则
              </h3>
              <p class="text-body-md text-on-surface-variant">
                技能互助是学习、指导与协作，不是学术代做。请遵守课程学术诚信要求，共同营造严谨求实的校园学术氛围。
              </p>
            </div>
          </div>
        </section>
        <!-- Main Content Grid -->
        <section
          class="mx-auto mb-24 grid w-full max-w-[1200px] grid-cols-1 gap-8 px-[32px] lg:grid-cols-12"
        >
          <!-- Left Column: Skill Exchange Cards (8 cols) -->
          <div
            class="flex flex-col gap-6 lg:col-span-8"
            id="skill-offers"
            hidden
          >
            <p class="text-body-sm text-outline">正在加载技能分享…</p>
          </div>
          <!-- Right Column: Help Plaza (4 cols) -->
          <div
            class="flex flex-col gap-6 lg:col-span-4"
            id="skill-requests"
            hidden
          >
            <p class="text-body-sm text-outline">正在加载求助…</p>
          </div>
        </section>
        <section
          class="mx-auto mb-20 w-full max-w-[1200px] px-[32px]"
          aria-labelledby="skill-stats-title"
        >
          <div class="rounded-2xl border border-outline-variant bg-surface p-6">
            <div class="flex flex-wrap items-end justify-between gap-2">
              <div>
                <h2
                  id="skill-stats-title"
                  class="font-headline-md text-primary"
                >
                  互助进展
                </h2>
                <p class="mt-1 text-body-sm text-outline">
                  数据按真实合作记录计算，时区：Asia/Shanghai。
                </p>
              </div>
              <span class="text-xs text-outline" data-skill-period
                >统计周期加载中…</span
              >
            </div>
            <div class="mt-5 grid gap-4 sm:grid-cols-3">
              <article class="rounded-xl bg-surface-container-low p-4">
                <p class="text-body-sm text-outline">本月成功配对</p>
                <strong
                  class="mt-1 block font-headline-lg text-primary"
                  data-skill-pairs
                  >读取中…</strong
                >
              </article>
              <article class="rounded-xl bg-surface-container-low p-4">
                <p class="text-body-sm text-outline">本月双方确认完成</p>
                <strong
                  class="mt-1 block font-headline-lg text-primary"
                  data-skill-completed
                  >读取中…</strong
                >
              </article>
              <article class="rounded-xl bg-surface-container-low p-4">
                <p class="text-body-sm text-outline">本月求助解决率</p>
                <strong
                  class="mt-1 block font-headline-lg text-primary"
                  data-skill-resolution
                  >读取中…</strong
                ><span class="text-xs text-outline" data-skill-resolution-detail
                  >正在计算分子与分母…</span
                >
              </article>
            </div>
          </div>
        </section>
        <!-- Publish Modal (Hidden by default) -->
        <div
          class="fixed inset-0 z-50 flex hidden items-center justify-center bg-inverse-surface/40 backdrop-blur-sm"
          id="publish-modal"
        >
          <div
            class="relative flex w-full max-w-lg flex-col gap-6 rounded-2xl bg-surface-container-lowest p-8 shadow-xl"
            id="skill-form"
            role="form"
          >
            <div class="flex items-center justify-between">
              <h3 class="font-headline-md text-headline-md text-primary">
                发布技能或求助
              </h3>
              <button
                type="button"
                class="text-outline hover:text-on-surface"
                onclick="
                  document
                    .getElementById('publish-modal')
                    .classList.add('hidden')
                "
              >
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <div class="flex flex-col gap-4">
              <div class="flex flex-col gap-1.5">
                <label class="text-label-md font-medium text-on-surface"
                  >发布类型</label
                >
                <div class="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    data-skill-kind="offer"
                    class="rounded-xl border border-primary bg-primary py-2.5 text-label-md font-medium text-on-primary"
                  >
                    提供技能共享
                  </button>
                  <button
                    type="button"
                    data-skill-kind="request"
                    class="rounded-xl border border-outline-variant py-2.5 text-label-md font-medium text-on-surface"
                  >
                    发起求助广场
                  </button>
                </div>
              </div>
              <div class="flex flex-col gap-1.5">
                <label
                  for="skill-title"
                  class="text-label-md font-medium text-on-surface"
                  >标题</label
                >
                <input
                  id="skill-title"
                  name="title"
                  required
                  minlength="3"
                  maxlength="100"
                  class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                  placeholder="例如：擅长 Python 数据分析 / 求助 FPGA 仿真"
                  type="text"
                />
              </div>
              <div class="flex flex-col gap-1.5">
                <label
                  for="skill-description"
                  class="text-label-md font-medium text-on-surface"
                  >详细描述</label
                >
                <textarea
                  id="skill-description"
                  name="description"
                  required
                  minlength="10"
                  maxlength="1000"
                  class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                  placeholder="请描述您的技能细节或求助问题背景..."
                  rows="3"
                ></textarea>
              </div>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <label
                  class="flex flex-col gap-1.5 text-label-md text-on-surface"
                  >我能提供<input
                    name="canOffer"
                    maxlength="200"
                    class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md focus:outline-none focus:ring-1 focus:ring-primary"
                    placeholder="例如：R 语言入门辅导"
                /></label>
                <label
                  class="flex flex-col gap-1.5 text-label-md text-on-surface"
                  >我想交流<input
                    name="wants"
                    maxlength="200"
                    class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md focus:outline-none focus:ring-1 focus:ring-primary"
                    placeholder="例如：嵌入式开发"
                /></label>
              </div>
              <div class="flex flex-col gap-1.5">
                <label
                  class="text-label-md font-medium text-on-surface"
                  for="skill-category"
                  >领域</label
                >
                <select
                  id="skill-category"
                  name="category"
                  required
                  class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                >
                  <option value="数据与科研">数据与科研</option>
                  <option value="生物实验">生物实验</option>
                  <option value="工程开发">工程开发</option>
                  <option value="AI与计算">AI与计算</option>
                  <option value="设计创作">设计创作</option>
                  <option value="其他">其他</option>
                </select>
              </div>
              <div class="flex flex-col gap-1.5">
                <label class="text-label-md font-medium text-on-surface"
                  >标签 (以空格分隔)</label
                >
                <input
                  id="skill-tags"
                  name="tags"
                  class="rounded-xl bg-surface-container-low px-4 py-2.5 text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary"
                  placeholder="#R #生物信息学 #STM32"
                  type="text"
                />
              </div>
            </div>
            <div class="flex items-center justify-end gap-3 pt-2">
              <button
                type="button"
                class="rounded-xl px-5 py-2.5 text-label-md text-on-surface-variant transition-all hover:bg-surface-container"
                onclick="
                  document
                    .getElementById('publish-modal')
                    .classList.add('hidden')
                "
              >
                取消
              </button>
              <button
                id="skill-submit"
                type="button"
                class="rounded-xl bg-primary px-6 py-2.5 text-label-md font-semibold text-on-primary transition-all hover:bg-secondary"
              >
                确认发布
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div data-layout="footer"></div>
  </body>
</html>
