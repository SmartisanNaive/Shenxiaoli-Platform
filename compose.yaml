x-runtime-environment: &runtime-environment
  NODE_ENV: production
  DEMO_AUTH_ENABLED: "false"
  RUN_MIGRATIONS: "false"
  DATABASE_PATH: /data/shenxiaoli.sqlite
  UPLOADS_PATH: /uploads
  PORT: "8787"
  SESSION_SECRET: ${SESSION_SECRET:?Set a long random SESSION_SECRET in .env}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
  RESEND_FROM: ${RESEND_FROM:?Set RESEND_FROM to an authenticated sender on a domain you control}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}

services:
  api:
    build:
      context: .
      target: api
    environment: *runtime-environment
    expose:
      - "8787"
    volumes:
      - sqlite-data:/data
      - uploads:/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: api
    command: ["bun", "run", "src/worker.ts"]
    environment: *runtime-environment
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  migrate:
    build:
      context: .
      target: api
    command: ["bun", "run", "src/migrate.ts"]
    environment:
      <<: *runtime-environment
      RUN_MIGRATIONS: "true"
    volumes:
      - sqlite-data:/data
    profiles:
      - ops

volumes:
  sqlite-data:
  uploads:
